name: app_save_money
description: "แอพจัดการรายรับรายจ่าย — อ่าน Slip อัตโนมัติ"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # Navigation
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Photo Gallery access (batch, เลือกเดือน)
  photo_manager: ^3.3.0

  # OCR - on-device ฟรี (Apple Vision บน iOS, ML Kit บน Android)
  google_mlkit_text_recognition: ^0.13.0

  # Charts for dashboard
  fl_chart: ^0.68.0

  # Date formatting
  intl: ^0.19.0

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Image display
  cached_network_image: ^3.3.1

  # Local storage
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
